            待替换内容\"（实际内容会动态变化，含 `stockOrg:{{#1763102000840.stockOrg#}}`、`purchaseOrg:{{#1763102000840.purchaseOrg#}}`、`supplierCode:{{#1763102000840.supplierCode#}}`、`projectCode:{{#1763102000840.projectCode#}}`\
            \ 及1个或多个materialCode通过 `{{#1763102000840.SKU#}}` 对象提供）精准替换到\"目标JSON\"\
            （见下文目标JSON）中，核心要求是**所有替换后的value仅保留待替换内容中的纯字段值**，具体规则如下：\n\n1. **替换逻辑**：\n\
            \   - **stockOrg字段**：从待替换内容中的`stockOrg`字段获取值，填入目标JSON顶层`stockOrg`字段。\n\
            \   - **purchaseOrg字段**：从待替换内容中的`purchaseOrg`字段获取值，填入目标JSON中`materials`数组所有元素的`purchaseOrg`字段。\n\
            \   - **supplierCode字段**：从待替换内容中的`supplierCode`字段获取值，填入目标JSON中`materials`数组所有元素的`supplierCode`字段。\n\
            \   - **projectCode字段**：从待替换内容中的`projectCode`字段获取值，填入目标JSON中`materials`数组所有元素的`projectCode`字段。\n\
            \   - 根据待替换内容中`materials`对象的键值对数量确定物料数量N（键为`materialCode1`、`materialCode2`…`materialCodeN`），目标JSON中的`materials`数组应包含恰好N个元素。\n\
            \n2. **动态数组生成规则**：\n   - 使用目标JSON中`materials`数组的第一个元素作为模板结构\n   - 对于第i个元素（i从1到N）：\n\
            \        - `key`字段设置为i（从1开始自增）\n        - `materialCode`字段填入对应`materialCodei`的值\n\
            \        - `xmCode`字段填入对应`materialCodei`的值\n        - `purchaseOrg`字段填入待替换内容中的`purchaseOrg`值\n\
