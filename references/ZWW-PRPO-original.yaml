          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: 2773c07c-51e6-49ac-8ef7-441e620be776
          role: system
          text: "请帮我根据{{#context#}}内容（含materialCode相关字段）、从上文获取的字段（stockOrg：{{#1763102000840.stockOrg#}}，值均为纯文本，无多余前缀）和数据表结构，生成一条SQL查询语句，**最终输出格式为子查询**，具体要求如下：\n\
            \n1. **查询目标**：获取符合条件的m_purchase表中最新的purchase_no，**以子查询形式输出**。\n2. **动态字段处理规则（**所有值仅保留纯原始内容，不附加任何前缀**）**：\n\
            \   - JSON中包含一个或多个以\"materialCode\"为前缀的字段（如materialCode1、materialCode2等），其值直接作为m_purchase_item表\"\
            xm_code\"字段的筛选条件：\n     - 如果只有一个materialCode，使用等号条件：`mpi.xm_code = '值'`\n\
            \     - 如果有多个materialCode，使用IN子句：`mpi.xm_code IN ('值1','值2',...)`\n  \
            \ - 从上文获取的\"stockOrg\"值（如\"MI_TV\"），直接作为m_purchase表\"stock_org\"字段的筛选值（格式为`mp2.stock_org\
            \ = 'MI_TV'`）。\n3. **表连接**：通过m_purchase表的\"purchase_no\"与m_purchase_item表的\"\
            purchase_no\"进行内连接。\n4. **筛选条件**：需同时满足上述字段映射关系。\n5. **最新数据**：按m_purchase表的\"\
            id\"字段降序排序，取第一条数据。\n6. **输出格式要求**：**最终SQL必须为子查询形式**，结构如下：\n   ```sql\n\
            \   SELECT mp.purchase_no\n   FROM m_purchase mp \n   WHERE mp.id = (\n\
            \       SELECT mp2.id \n       FROM m_purchase mp2 \n       INNER JOIN\
            \ m_purchase_item mpi ON mp2.purchase_no = mpi.purchase_no \n       WHERE\
            \ mp2.stock_org = '[stockOrg值]'  \n         AND [xm_code筛选条件]\n      \
            \ ORDER BY mp2.id DESC \n       LIMIT 1\n   )\n   ```\n\n**动态值替换说明**：\n\
            - `[stockOrg值]`：替换为从上文获取的stockOrg实际值（如'MI_TV'）\n- `[xm_code筛选条件]`：根据JSON中materialCode字段数量动态生成：\n\
            \  - 如果只有一个materialCode：`mpi.xm_code = '具体值'`\n  - 如果有多个materialCode：`mpi.xm_code\
            \ IN ('值1','值2',...)`\n\n**JSON内容示例**（仅含materialCode相关字段，值为纯文本）：\n```json\n\
            {\n\"materialCode1\":\"ELA4130CN\"\n}\n```\n\n或\n```json\n{\n\"materialCode1\"\
            :\"1710301000006B\",\n\"materialCode2\":\"1710301000006A\"\n}\n```\n\n\
            **数据表结构**：（与用户提供的表结构相同，此处省略以节省空间）\n\n请仅输出生成的**子查询形式SQL语句**，不需要携带```sql，且不要包含任何额外文字说明。\n"
