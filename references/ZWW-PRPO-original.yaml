    - data:
        context:
          enabled: true
          variable_selector:
          - '1763102000840'
          - SKU
        desc: ''
        model:
          completion_params: {}
          mode: chat
          name: gpt-4o-mini_mi_sys
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: b75b6ebf-ac51-4b24-bc12-40996baf2a54
          role: system
          text: "你是一个json转换器，可以将给定的数据按要求填充到json中，最终返回一个可以直接拿来发送请求的json。\n请帮我将\"待替换内容\"\
            （实际内容会动态变化，含stockOrg:{{#1763102000840.stockOrg#}}、purchaseOrg:{{#1763102000840.purchaseOrg#}}及1个或多个materialCode通过{{#1763102000840.SKU#}}对象提供）精准替换到\"\
            目标JSON\"（见下文目标JSON）中，核心要求是**所有替换后的value仅保留待替换内容中的纯字段值，完全不含原字段名（如stockOrg、purchaseOrg等）作为前缀，也不附加任何后缀或多余字符**，具体规则如下：\n\
            \n1. 替换逻辑（通用适配，纯值替换，无多余内容）：\n   - 待替换内容中的\"stockOrg\"字段值，仅填入\"目标JSON\"\
            顶层\"stockOrg\"的value，值中绝对不含\"stockOrg\"前缀；\n   - 待替换内容中的\"purchaseOrg\"\
            字段值，仅填入\"目标JSON\"内\"materials\"数组所有元素的\"purchaseOrg\"value，值中绝对不含\"purchaseOrg\"\
            前缀；\n   - 根据待替换内容中\"SKU\"对象的键值对数量确定物料数量N（键为\"SKU1\"、\"SKU2\"…\"SKUN\"\
            ）。\"目标JSON\"中的\"SKU\"数组应包含恰好N个元素，每个元素基于以下规则生成：\n        - 使用\"目标JSON\"\
            中\"SKU\"数组的第一个元素作为模板结构\n        - 对于第i个元素（i从1到N）：\n             - \"key\"\
            字段设置为i（从1开始自增：第一个元素key为1，第二个为2，以此类推）\n             - \"xmCode\"字段填入对应\"\
            materialCodei\"的值\n             - \"materialCode\"字段填入对应\"materialCodei\"\
            的值\n             - \"value\"字段填入对应\"materialCodei\"的值\n             -\
            \ \"purchaseOrg\"字段填入待替换内容中的\"purchaseOrg\"值\n        - 其他字段保留模板中的值\n\n\
            2. 示例说明（仅作参考，实际内容动态变化，重点看纯值替换效果和动态数量适配）：\n   - 示例待替换内容（2个物料）：\n     {\n\
            \       \"stockOrg\": \"MI_TV\",\n       \"purchaseOrg\": \"TV_ORG\",\n\
            \       \"SKU\": {\"SKU1\": \"SKU001\", \"SKU2\": \"SKU002\"}\n     }\n\
            \   - 示例目标JSON替换后（仅展示关键替换位置，materials数组数量为2）：\n     {\n       \"isSubmit\"\
            : true,\n       \"purchaseType\": 15,\n       \"stockOrg\": \"MI_TV\"\
            ,\n       \"materials\": [\n         {\n           \"key\": 1,\n     \
            \      \"xmCode\": \"SKU001\",\n           \"materialCode\": \"SKU001\"\
            ,\n           \"value\": \"SKU001\",\n           \"purchaseOrg\": \"TV_ORG\"\
            ,\n           // 其他字段保留模板值\n         },\n         {\n           \"key\"\
            : 2,\n           \"xmCode\": \"SKU002\",\n           \"materialCode\"\
            : \"SKU002\",\n           \"value\": \"SKU002\",\n           \"purchaseOrg\"\
            : \"TV_ORG\",\n           // 其他字段保留模板值\n         }\n       ]\n     }\n\
            \n3. 输出要求：\n   - **最终只输出一个完整的JSON对象**，其materials数组元素数量严格等于待替换内容中的物料数量N\n\
            \   - 每个materials元素的key从1开始自增\n   - 不包含任何额外文字说明、注释或格式标记\n\n目标JSON（作为结构模板参考）：\n\
            {\n    \"isSubmit\": true,\n    \"purchaseType\": 15,\n    \"stockOrg\"\
            : \"${库存组织}\",\n    \"materials\": [\n        {\n            \"goodsId\"\
            : \"15563\",\n            \"materialDesc\": \"小米电视65寸 直下一体（T21） 高配版 量产\"\
            ,\n            \"purchaseOrg\": \"${采购组织}\",\n            \"catePathCode\"\
            : \"114\",\n            \"baseUom\": \"PC\",\n            \"key\": 1,\n\
            \            \"xmCode\": \"${物料编号}\",\n            \"number\": 10000,\n\
            \            \"receiveDate\": 1797048732000,\n            \"stockPlace\"\
            : \"F000\",\n            \"channel\": \"CN\",\n            \"isNew\":\
