            : 15,\n       \"stockOrg\": \"MI_LAPTOP\",\n       \"materials\": [\n\
            \         {\n           \"materialDesc\": \"RedmiBook Pro 14 RDX122I0D/CN\"\
            ,\n           \"purchaseOrg\": \"LAPTOP_ORG\",\n           \"catePathCode\"\
            : \"1.98.5304.5345.5360\",\n           \"baseUom\": \"PC\",\n        \
