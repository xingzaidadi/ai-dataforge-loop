            : \"笔电项目\",\n            \"prodMaterialCode\": \"\"\n        }\n    ]\n\
            }\n```\n\n请严格按上述规则处理，无论待替换内容中的`materials`对象数量如何变化，均确保：\n- `materials`数组元素数量与物料数量完全一致\n\
            - 每个元素的`key`从1开始自增\n- 所有元素的`purchaseOrg`、`supplierCode`、`projectCode`字段值相同，均为从待替换内容中获取的对应值\n\
