            \n           },\n           \"receiveDateTimeStamp\": 1765512732000,\n\
            \           \"projectType\": \"笔电项目\",\n           \"prodMaterialCode\"\
            : \"\"\n         }\n       ]\n     }\n     ```\n\n4. **输出要求**：\n   - **最终只输出一个完整的JSON对象**，其`materials`数组元素数量严格等于待替换内容中的物料数量N\n\
