    - data:
        code: "import json\n\nCONST_T_CODES = [\"100227\", \"100015\", \"101550\"\
          , \"101408\", \"100171\", \"124899\", \"133041\", \"126929\"]\nGAOTONG_CODES\
          \ = [\"100171\", \"124899\"]\nMTK_CODES = [\"100227\", \"101550\", \"100015\"\
          , \"101408\"]\nTI_CODES = [\"126929\", \"133041\"]\nCHENGPIN_TYPES = [\"\
          ZWW\", \"ZPJ\", \"ZDB\"]\nJC_TYPES = [\"ZJC\"]\n\n# ZWW走成品判断\ndef zww_is_laliao(caizu,\
          \ kuwei, stock_to, material_group):\n    if caizu == \"ZWW\" and kuwei ==\
          \ \"F000\" and stock_to == \"MI_AUTOEACC\" and material_group and material_group.startswith(\"\
          S\"):\n        return True\n    return False\n\ndef main(arg1: str, arg2:\
          \ str) -> dict:\n    print(arg1)\n    callin_datas = []\n    if arg2 is\
          \ not None and arg2.strip():\n        try:\n            callin_command_result\
          \ = json.loads(arg2)\n            callin_datas = callin_command_result.get(\"\
          data\", [])\n        except json.JSONDecodeError:\n            callin_datas\
          \ = []\n    else:\n        callin_datas = []\n    \n    try:\n        result\
          \ = json.loads(arg1)\n    except json.JSONDecodeError:\n        result =\
          \ {}\n    datas = result.get(\"data\", [])\n    results = []\n    supplier_code\
          \ = \"\"\n    caizu = \"\"\n    out_factory = \"\"\n    material_group =\
          \ \"\"\n    stock_org_to = \"\"\n    kuwei = \"\"\n    \n    cnt = len(datas)\n\
          \    if cnt > 3:\n        cnt = 3\n    ztcallin_cnt = len(callin_datas)\n\
          \    if ztcallin_cnt > 3:\n        ztcallin_cnt = 3\n    \n    for data_item\
          \ in datas:\n        material_code = data_item.get(\"MATNR\")\n        supplier_code\
          \ = data_item.get(\"LIFNR\", \"\")\n        # 订单类型\n        caizu = data_item.get(\"\
          BSART\", \"\")\n        out_factory = data_item.get(\"LIFNR_DG\", \"\")\n\
          \        # ZWW额外处理, 物料组\n        material_group = data_item.get(\"MATKL\"\
          , \"\")\n        stock_org_to = data_item.get(\"STOCK_ORG_TO\", \"\")\n\
          \        kuwei = data_item.get(\"LGORT\", \"\")\n    \n    # 成品类的调整数量上限为2\n\
          \    if caizu in CHENGPIN_TYPES + JC_TYPES and cnt >= 3:\n        cnt =\
          \ 2\n    \n    is_znb = False\n    print(caizu, supplier_code, out_factory)\n\
          \    print(caizu=='ZNB')\n    print(supplier_code not in CONST_T_CODES)\n\
          \    print(out_factory == \"\")\n    \n    if caizu == \"ZNB\" and supplier_code\
          \ not in CONST_T_CODES and out_factory == \"\":\n        is_znb = True\n\
          \    \n    task_type = \"\"\n    print(\"is_ZNB\")\n    print(is_znb)\n\
          \    \n    # 先判断三大\n    if supplier_code in GAOTONG_CODES:\n        task_type\
          \ = \"GAOTONG_\" + str(cnt)\n    elif supplier_code in MTK_CODES:\n    \
          \    task_type = \"MTK_\" + str(cnt)\n    elif supplier_code in TI_CODES:\n\
          \        task_type = \"TI_\" + str(cnt)\n    else:\n        if arg2 is not\
          \ None:\n            task_type = \"CIN_\" + str(ztcallin_cnt)\n        elif\
          \ caizu in CHENGPIN_TYPES and material_group.lower().startswith((\"s\",\
          \ \"f\")):\n            task_type = \"CHENGPIN_\" + str(cnt)\n        elif\
          \ caizu in JC_TYPES:\n            task_type = \"JC_\" + str(cnt)\n     \
          \   else:\n            task_type = \"PO_\" + str(cnt)\n        \n    zww_2_chengping\
          \ = zww_is_laliao(caizu, kuwei, stock_org_to, material_group)\n    if zww_2_chengping:\n\
          \        task_type = \"CHENGPIN_\" + str(cnt)\n    \n    return {\"task_type\"\
          : task_type}"
