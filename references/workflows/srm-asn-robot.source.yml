app:
  description: '三大EDI ASN-支持

    非三大大货ASN-支持

    非三大独立需求ASN-支持

    成品创建ASN

    备注：可能有接单失败、ASN创建失败的情况。具体错误可以联系同事A、同事B、刘四星排查；'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: SRM ASN建单机器人
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 100
        batch_count_limit: 5
        feishu_file_count_limit: 20
        feishu_url_count_limit: 20
        file_size_limit: 100
        image_file_size_limit: 30
        video_file_size_limit: 800
        workflow_file_upload_limit: 50
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
