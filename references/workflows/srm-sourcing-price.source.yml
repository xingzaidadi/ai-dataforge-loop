    - data:
        code: "import datetime\nfrom datetime import timedelta\n\ndef main(arg1: str,\
          \ arg2: str, arg3: str, arg4: str, arg5: str, arg6: str, arg7: str, arg8:\
          \ str, arg9: str, arg10: str) -> dict:\n    current_date = datetime.date.today()\
          \  # 获取当前日期（仅日期部分）\n    \n    # 正确计算一年后日期（timedelta不支持years，用年份直接+1并处理闰年）\n\
          \    try:\n        one_year_later = current_date.replace(year=current_date.year\
          \ + 1)\n    except ValueError:\n        # 处理闰年2月29日的特殊情况\n        one_year_later\
          \ = current_date.replace(year=current_date.year + 1, month=3, day=1)\n \
          \   \n    if arg1 not in (None, \"material\"):\n        if arg10 not in\
          \ (None, \"\"):\n            priceType = arg10\n        else:\n        \
          \    priceType = \"mav_fee,odm_owned_fee\"\n    else:\n        priceType\
          \ = \"material\"\n\n    return {\n        \"materialType\": arg1 if arg1\
          \ is not None else \"material\",\n        \"sourceType\": arg2 if arg2 is\
          \ not None else \"ZWW\", \n        \"purchaseMode\": arg3 if arg3 is not\
          \ None else \"NORMAL\",\n        \"gross\": arg4 if arg4 is not None else\
          \ \"10000\",\n        \"kpein\": arg5 if arg5 is not None else \"WPCS\"\
          , \n        \"taxCode\": arg6 if arg6 is not None else \"J2\", \n      \
          \  \"taxrt\": arg7 if arg7 is not None else \"0.13\",\n        \"datab\"\
          : arg8 if arg8 is not None else current_date.strftime(\"%Y%m%d\"), \n  \
          \      \"datbi\": arg9 if arg9 is not None else one_year_later.strftime(\"\
          %Y%m%d\"),\n        \"priceType\": priceType    \n    }\n"
