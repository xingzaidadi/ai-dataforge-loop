        prompt_template:
        - id: a52c29dc-a9a9-40bd-a647-0c7b9f8d4b7e
          role: system
          text: '获取{{#17574686095840.body#}}中data数据，应该是个map格式，将每个ksy和value取出来进行解读

            key为”price_type“的直接忽略

            key为”asl“的若是存在，且内容为”公服不存在ASL“则调用则输出"ASL在公服中不存在"

            key为”pn_map“的若是存在，且内容“价格中心”冒号后分号前没代码，则输出”价格中心未绑定费用PN“

            key为”cost_configure“的若是存在，且内容为”费用项配置不存在”则输出"费用项未配置"

            key为”price_list“的若是提示”不存在xxx定价单“，则输出”定价单在价格中心中不存在“

