    - data:
        context:
          enabled: true
          variable_selector:
          - '1762304563504'
          - materials
        desc: ''
        model:
          completion_params: {}
          mode: chat
          name: gpt-4.1_mi_sys
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: 25fedfdf-c574-486e-841f-57fa74fd6fc5
          role: system
          text: "请帮我根据{{#context#}}内容（含materialCode相关字段）、从上文获取的字段（stockOrg：{{#1762304563504.stockOrg#}}、projectCode：{{#1762304563504.projectCode#}}、supplierCode：{{#1762304563504.supplierCode#}}，值均为纯文本，无多余前缀）和数据表结构，生成一条SQL查询语句，具体要求如下：\n\
            \n1. 查询目标：获取符合条件的、m_purchase表中status为10的最新数据的purchase_no和business_key。\n\
            2. 动态字段处理规则（** 所有值仅保留纯原始内容，不附加任何前缀 **）：\n   - JSON中包含一个或多个以\"materialCode\"\
            为前缀的字段（如materialCode1、materialCode2等），其值直接作为m_purchase_item表\"xm_code\"\
            字段的筛选条件，用IN子句包含（例如值为\"1710301000006B\"则直接填入，无额外字符）；\n   - 从上文获取的\"stockOrg\"\
            值（如\"MI_IOT\"），直接作为m_purchase表\"stock_org\"字段的筛选值（格式为mp.stock_org = 'MI_IOT'）；\n\
            \   - 从上文获取的\"projectCode\"值：若该值有内容，则直接作为m_purchase表\"project_code\"字段的筛选值（格式为mp.project_code\
            \ = '值'）；若该值无内容（含空字符串），则不在SQL语句中拼接该筛选条件；\n   - 从上文获取的\"supplierCode\"\
            值（如\"108062\"），直接作为m_purchase_item表\"supplier_code\"字段的筛选值（格式为mpi.supplier_code\
            \ = '108062'）；\n   -** 不使用从上文获取的\"purchaseOrg\"作为筛选条件 **。\n3. 表连接：通过m_purchase表的\"\
            purchase_no\"与m_purchase_item表的\"purchase_no\"进行内连接。\n4. 筛选条件：需同时满足上述字段映射关系（空值字段除外），且m_purchase表的\"\
            status\"字段值为10。\n5. 最新数据：按m_purchase表的\"updated_at\"字段降序排序，取第一条数据。\n\n\
            JSON内容为动态变化示例（仅含materialCode相关字段，值为纯文本）：\n{\n\"materialCode1\":\"1710301000006B\"\
            ,\n\"materialCode2\":\"1710301000006A\"\n}\n\n数据表结构：\nCREATE TABLE `m_purchase`\
            \ (\n  `id` int(10) unsigned NOT NULL AUTO_INCREMENT COMMENT '主键ID',\n\
            \  `purchase_no` char(32) NOT NULL DEFAULT '' COMMENT '采购申请单号',\n  `purchase_type`\
            \ tinyint(2) NOT NULL DEFAULT '0' COMMENT '采购申请类型：1-研发工厂自采；2-物料风险采购；3-免费物料采购；4-试产物料采购;5-验证物料采购;6-二级物料采购;7-售后备件采购;8-售后重工采购;9-普通物料采购;10-未认证物料采购;11-印尼重工物料采购;12-海外补损物料采购',\n\
            \  `stock_org` varchar(20) NOT NULL DEFAULT '' COMMENT '库存组织',\n  `product_line`\
            \ varchar(20) NOT NULL DEFAULT '' COMMENT '业务线',\n  `apply_type` varchar(20)\
            \ NOT NULL DEFAULT '' COMMENT '采购组织',\n  `receive_factory_id` int(10)\
            \ NOT NULL DEFAULT '0' COMMENT '收货工厂ID',\n  `receive_factory_code` varchar(16)\
            \ NOT NULL DEFAULT '' COMMENT '收货工厂编码',\n  `sap_factory_code` varchar(16)\
            \ NOT NULL DEFAULT '' COMMENT 'SAP工厂',\n  `company_code` varchar(16) NOT\
            \ NULL DEFAULT '' COMMENT '公司CODE',\n  `project_code` varchar(32) NOT\
            \ NULL DEFAULT '' COMMENT '项目名称',\n  `total_amount` decimal(24,6) NOT\
            \ NULL DEFAULT '0.000000' COMMENT '总金额',\n  `status` tinyint(3) NOT NULL\
            \ DEFAULT '0' COMMENT '状态',\n  `business_key` varchar(64) NOT NULL DEFAULT\
            \ '' COMMENT '流程KEY',\n  `proc_inst_id` varchar(32) NOT NULL DEFAULT ''\
            \ COMMENT 'procInstId',\n  `created_by` varchar(64) NOT NULL DEFAULT ''\
            \ COMMENT '申请人',\n  `created_at` bigint(20) NOT NULL DEFAULT '0' COMMENT\
            \ '添加时间',\n  `updated_at` bigint(20) NOT NULL DEFAULT '0' COMMENT '更新时间',\n\
            \  `receive_warehouse` varchar(16) NOT NULL DEFAULT '' COMMENT '收获仓库编码',\n\
            \  `require_department_code` varchar(16) NOT NULL DEFAULT '' COMMENT '需求部门编码',\n\
            \  `require_department_name` varchar(50) NOT NULL DEFAULT '' COMMENT '需求部门名称',\n\
            \  `apply_department_code` varchar(16) NOT NULL DEFAULT '' COMMENT '申请部门编码',\n\
            \  `apply_department_name` varchar(64) NOT NULL DEFAULT '' COMMENT '申请部门名称',\n\
            \  `purchase_reason` tinyint(2) NOT NULL DEFAULT '0' COMMENT '采购原因',\n\
            \  `material_line_num` int(10) unsigned NOT NULL DEFAULT '0' COMMENT '物料行数',\n\
            \  `deal_num` decimal(11,3) unsigned NOT NULL DEFAULT '0.000' COMMENT\
            \ '需要处理物料总数量',\n  `finished_num` decimal(11,3) unsigned NOT NULL DEFAULT\
            \ '0.000' COMMENT '已处理物料总数量',\n  `source` varchar(16) NOT NULL DEFAULT\
            \ 'SCM' COMMENT '创建来源,scm,srm,计划平台ESP-MIP,ESP-SRM,SCM,统一大写',\n  `special_approve`\
            \ tinyint(1) NOT NULL DEFAULT '0' COMMENT '是否走特例审批 1-是 0-否',\n  `spm_purchase_no`\
            \ varchar(20) NOT NULL DEFAULT '' COMMENT 'spm原始采购单号',\n  `another_reason`\
            \ varchar(500) NOT NULL DEFAULT '' COMMENT '其他采购原因',\n  `factory_code`\
            \ varchar(20) NOT NULL DEFAULT '' COMMENT '提单人工厂code',\n  `purchase_org`\
            \ varchar(20) NOT NULL DEFAULT '' COMMENT '采购组织',\n  `customer_code` varchar(20)\
            \ NOT NULL DEFAULT '' COMMENT '客户编码',\n  `fpo_95_no` varchar(20) NOT NULL\
            \ DEFAULT '' COMMENT '95FPO单号',\n  `business_type` varchar(20) NOT NULL\
            \ DEFAULT '' COMMENT '业务类型',\n  `source_no` varchar(20) NOT NULL DEFAULT\
            \ '' COMMENT '来源单号',\n  `ext_doc_no` varchar(32) NOT NULL DEFAULT '' COMMENT\
            \ '外部凭证号(客户PO号、代工厂PO号等)',\n  `consolidation_batch_no` varchar(50) NOT\
            \ NULL DEFAULT '' COMMENT '集结批次号',\n  `purchase_group` varchar(10) NOT\
            \ NULL DEFAULT '' COMMENT '采购组',\n  `rma` char(1) NOT NULL DEFAULT ''\
            \ COMMENT '是代表是成品售后RMA业务；否代表成品大货业务;默认为否',\n  PRIMARY KEY (`id`),\n  UNIQUE\
            \ KEY `uk_purchase_no` (`purchase_no`),\n  KEY `idx_created_by` (`created_by`),\n\
            \  KEY `idx_purchase_type` (`purchase_type`) USING BTREE,\n  KEY `idx_created_at`\
            \ (`created_at`) USING BTREE,\n  KEY `idx_factory_code` (`factory_code`)\
            \ USING BTREE\n) ENGINE=InnoDB AUTO_INCREMENT=1608982 DEFAULT CHARSET=utf8\
            \ COMMENT='采购表';\nCREATE TABLE `m_purchase_item` (\n  `id` int(10) unsigned\
            \ NOT NULL AUTO_INCREMENT COMMENT '主键ID',\n  `purchase_id` int(10) NOT\
            \ NULL DEFAULT '0' COMMENT '采购表ID',\n  `purchase_no` char(32) NOT NULL\
            \ DEFAULT '' COMMENT '采购申请单号',\n  `row_no` int(10) NOT NULL DEFAULT '0'\
            \ COMMENT '行号',\n  `agg_id` varchar(100) NOT NULL DEFAULT '' COMMENT '采购协议号',\n\
            \  `xm_code` varchar(64) NOT NULL DEFAULT '' COMMENT '物料编号',\n  `cate_path_code`\
            \ varchar(40) NOT NULL DEFAULT '' COMMENT '物料分类code',\n  `cate_path_name`\
            \ varchar(255) NOT NULL DEFAULT '' COMMENT '物料分类名称',\n  `description`\
            \ varchar(1000) NOT NULL DEFAULT '' COMMENT '物料描述',\n  `number` decimal(15,3)\
