    - data:
        code: "\nimport json\ndef main(arg1) -> dict:\n\n    xm_codes = []\n    \n\
          \    # 先确保入参是列表类型，否则直接返回空结果\n    if not isinstance(arg1, list):\n      \
          \  return {\"result\": xm_codes}\n    \n    # 遍历外层数组的每个元素（每个元素是字典）\n   \
          \ for item in arg1:\n        # 仅处理字典类型的元素\n        if not isinstance(item,\
          \ dict):\n            continue\n        \n        # 获取当前字典中的\"result\"列表（若不存在或不是列表，忽略）\n\
          \        inner_result = item.get(\"result\", [])\n        if not isinstance(inner_result,\
          \ list):\n            continue\n        \n        # 遍历inner_result列表，提取每个元素中的\"\
          xm_code\"\n        for sub_item in inner_result:\n            if isinstance(sub_item,\
          \ dict) and \"xm_code\" in sub_item:\n                xm_codes.append(sub_item[\"\
          xm_code\"])\n    \n    # 按指定结构返回结果\n    return {\"result\": xm_codes}"
