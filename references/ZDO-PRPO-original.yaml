    - data:
        context:
          enabled: true
          variable_selector:
          - '1762304563504'
          - materials
        desc: ''
        model:
          completion_params: {}
          mode: chat
          name: gpt-4o-mini_mi_sys
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: 0e813eb0-e3d5-49e1-a2d9-18d5eae9ac7d
          role: system
          text: "请帮我根据{{#context#}}内容（含materialCode相关字段）、从上文获取的字段（stockOrg：{{#1762304563504.stockOrg#}}、projectCode：{{#1762304563504.projectCode#}}，值均为纯文本，无多余前缀）和数据表结构，生成一条SQL查询语句，**最终输出格式为子查询**，具体要求如下：\n\
            \n1. **查询目标**：获取符合条件的、m_purchase表中status为10的最新数据的purchase_no和business_key，**以子查询形式输出**。\n\
            2. **动态字段处理规则（**所有值仅保留纯原始内容，不附加任何前缀**）**：\n   - JSON中包含一个或多个以\"materialCode\"\
            为前缀的字段（如materialCode1、materialCode2等），其值直接作为m_purchase_item表\"xm_code\"\
            字段的筛选条件，用IN子句包含（例如值为\"1710301000006B\"则直接填入，无额外字符）；\n   - 从上文获取的\"stockOrg\"\
            值（如\"MI_IOT\"），直接作为m_purchase表\"stock_org\"字段的筛选值（格式为mp.stock_org = 'MI_IOT'）；\n\
            \   - 从上文获取的\"projectCode\"值：若该值有内容，则直接作为m_purchase表\"project_code\"字段的筛选值（格式为mp.project_code\
            \ = '值'）；若该值无内容（含空字符串），则不在SQL语句中拼接该筛选条件；\n   - **不使用从上文获取的\"purchaseOrg\"\
            作为筛选条件**。\n3. **表连接**：通过m_purchase表的\"purchase_no\"与m_purchase_item表的\"\
            purchase_no\"进行内连接。\n4. **筛选条件**：需同时满足上述字段映射关系（空值字段除外），且m_purchase表的\"\
            status\"字段值为10。\n5. **最新数据**：按m_purchase表的\"id\"字段降序排序，取第一条数据。\n6. **输出格式要求**：**最终SQL必须为子查询形式**，结构如下：\n\
            \   ```sql\n   SELECT mp.purchase_no, mp.business_key \n   FROM m_purchase\
            \ mp \n   WHERE mp.id = (\n       SELECT mp2.id \n       FROM m_purchase\
            \ mp2 \n       INNER JOIN m_purchase_item mpi ON mp2.purchase_no = mpi.purchase_no\
            \ \n       WHERE mp2.status = 10 \n         AND mp2.stock_org = '[stockOrg值]'\
            \  \n         [AND mp2.project_code = '[projectCode值]'  -- 仅当projectCode有值时包含]\n\
            \         AND mpi.xm_code IN ([materialCode值列表])\n       ORDER BY mp2.id\
            \ DESC \n       LIMIT 1\n   )\n   ```\n\n**动态值替换说明**：\n- `[stockOrg值]`：替换为从上文获取的stockOrg实际值（如'MI_IOT'）\n\
            - `[projectCode值]`：仅当projectCode有值时包含该条件行，替换为实际值（如'EcoOdmJdm20240708220947-EU'）\n\
            - `[materialCode值列表]`：根据JSON中materialCode字段数量动态生成，格式为'值1','值2',...（如'1710301000006B','1710301000006A'）\n\
            \n**JSON内容示例**（仅含materialCode相关字段，值为纯文本）：\n```json\n{\n\"materialCode1\"\
            :\"1710301000006B\",\n\"materialCode2\":\"1710301000006A\"\n}\n```\n\n\
            **数据表结构**：（与用户提供的表结构相同，此处省略以节省空间）\n\n请仅输出生成的**子查询形式SQL语句**，不需要携带```sql，且不要包含任何额外文字说明。\n"
        selected: false
