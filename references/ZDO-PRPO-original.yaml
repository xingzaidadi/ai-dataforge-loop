      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - '1762304563504'
          - materials
        desc: ''
        model:
          completion_params: {}
          mode: chat
          name: gpt-4.1_mi_sys
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: c484a005-887c-4d86-860c-7cdf4aa44bd7
          role: system
          text: "你是一个json转换器，可以将给定的数据按要求填充到json中，最终返回一个可以直接拿来发送请求的json。\n请帮我将\"待替换内容\"\
            （实际内容会动态变化，含id:{{#1762742159387.id#}}、stockOrg:{{#1762304563504.stockOrg#}}、purchaseOrg:{{#1762304563504.purchaseOrg#}}、supplierCode:{{#1762304563504.supplierCode#}}、projectCode:{{#1762304563504.projectCode#}}及1个或多个materialCode通过{{#1762304563504.materials#}}对象提供）精准替换到\"\
            目标JSON\"（见下文目标JSON）中，核心要求是**所有替换后的value仅保留待替换内容中的纯字段值，完全不含原字段名（如stockOrg、purchaseOrg等）作为前缀，也不附加任何后缀或多余字符**，具体规则如下：\n\
            \n1. 替换逻辑（通用适配，纯值替换，无多余内容）：\n   - 待替换内容中的\"id\"字段值，仅填入\"目标JSON\"顶层\"receiveFactoryId\"\
            的value，值中绝对不含\"id\"前缀；\n   - 待替换内容中的\"stockOrg\"字段值，仅填入\"目标JSON\"顶层\"\
            stockOrg\"的value，值中绝对不含\"stockOrg\"前缀；\n   - 待替换内容中的\"purchaseOrg\"字段值，仅填入\"\
            目标JSON\"内\"materials\"数组所有元素的\"purchaseOrg\"value，值中绝对不含\"purchaseOrg\"\
            前缀；\n   - 根据待替换内容中\"materials\"对象的键值对数量确定物料数量N（键为\"materialCode1\"、\"\
            materialCode2\"…\"materialCodeN\"）。\"目标JSON\"中的\"materials\"数组应包含恰好N个元素，每个元素基于以下规则生成：\n\
            \        - 使用\"目标JSON\"中\"materials\"数组的第一个元素作为模板结构\n        - 对于第i个元素（i从1到N）：\n\
            \             - \"key\"字段设置为i（从1开始自增：第一个元素key为1，第二个为2，以此类推）\n        \
            \     - \"materialCode\"字段填入对应\"materialCodei\"的值\n             - \"value\"\
            字段填入对应\"materialCodei\"的值\n             - \"xmCode\"字段填入对应\"materialCodei\"\
            的值\n             - \"purchaseOrg\"字段填入待替换内容中的\"purchaseOrg\"值\n      \
            \       - \"supplierCode\"字段填入待替换内容中的\"supplierCode\"值\n             -\
            \ \"supplierCodeOption\"对象中的\"value\"和\"key\"字段填入待替换内容中的\"supplierCode\"\
            值\n        - 其他字段保留模板中的值\n   - 待替换内容中的\"supplierCode\"字段值，仅填入\"目标JSON\"\
            内\"materials\"数组所有元素的\"supplierCode\"value，值中绝对不含\"supplierCode\"前缀；\n\
            \   - 待替换内容中的\"projectCode\"字段值，仅填入\"目标JSON\"顶层\"projectCode\"的value，值中绝对不含\"\
            projectCode\"前缀；\n   - **新增说明**：如果待替换内容中未获取到projectCode值，则目标JSON中的projectCode字段保持为空字符串。\n\
            \n2. 示例说明（仅作参考，实际内容动态变化，重点看纯值替换效果和动态数量适配）：\n   - 示例待替换内容（1个物料）：\n    \
            \ {\n       \"id\": \"12345\",\n       \"stockOrg\": \"MI_WEAR\",\n  \
            \     \"purchaseOrg\": \"111J\",\n       \"supplierCode\": \"0000100283\"\
            ,\n       \"projectCode\": \"P01-AL\",\n       \"materials\": {\"materialCode1\"\
            : \"1240104000041B\"}\n     }\n   - 示例目标JSON替换后（仅展示关键替换位置，materials数组数量为1）：\n\
            \     {\n       \"stockOrg\": \"MI_WEAR\",\n       \"receiveFactoryId\"\
            : \"12345\",\n       \"materials\": [\n         {\n           \"key\"\
            : 1,\n           \"materialCode\": \"1240104000041B\",\n           \"\
            value\": \"1240104000041B\",\n           \"xmCode\": \"1240104000041B\"\
            ,\n           \"purchaseOrg\": \"111J\",\n           \"supplierCode\"\
            : \"0000100283\",\n           \"supplierCodeOption\": {\n            \
            \ \"value\": \"0000100283\",\n             \"key\": \"0000100283\"\n \
            \          }\n           // 其他字段保留模板值\n         }\n       ],\n       \"\
            projectCode\": \"P01-AL\",\n       // 其他字段保留模板值\n     }\n\n3. 输出要求：\n\
            \   - **最终只输出一个完整的JSON对象**，其materials数组元素数量严格等于待替换内容中的物料数量N\n   - 每个materials元素的key从1开始自增\n\
            \   - 不包含任何额外文字说明、注释或格式标记\n\n目标JSON（作为结构模板参考）：\n{\n  \"stockOrg\": \"\
            MI_WEAR\",\n  \"receiveFactoryId\": 731,\n  \"materials\": [\n    {\n\
            \      \"description\": \"电感_功率电感_2016_2016_1.0 mm_±20%_2.2_2.7 A_3.0\
            \ A_2.8 A_3.3 A_58 mΩ_底面电极_75 mΩ_HTTH20161T-2R2MSR_Cyntec\",\n      \"\
